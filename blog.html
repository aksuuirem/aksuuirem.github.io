	<style>
        body {
            background-image: url('./img/bgimage3.jpg'); /* Arka plan resminin yolu */
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
			color: white;
        }
		/* Linkler ve başlıklar gibi öğeler için de beyaz rengi uygulayabilirsiniz */
		a, h1, h2, h3, h4, h5, h6, p {
		color: #6A0D91 ;
		}
		/* Diğer stil kodlarınızın üzerine ekleyin */

		.portfolio_box {
			display: flex;
			flex-direction: column;
			align-items: center;
			height: 376px;
			position: relative;
			overflow: hidden;
			margin-bottom: 30px;
		}

		.single_portfolio {
			flex: 1;
			display: flex;
			align-items: center;
			justify-content: center;
			position: relative;
			width: 100%;
		}

		.single_portfolio img {
			width: 100%;
			height: 100%;
			object-fit: cover;
		}
		.short_info h5 {
			margin: 0;
			color: #6A0D91;
		}
		.feature_item {
		width: 100%; /* Her feature_item'ı sütunun tamamını kaplayacak şekilde genişletir */
		height: 400px; /* Sabit yükseklik belirler, isteğe göre değiştirilebilir */
		text-align: center; /* İçeriği ortalar */
		padding: 20px; /* İçerik etrafına boşluk ekler */
		box-sizing: border-box; /* Padding ile toplam boyutu kontrol eder */
		display: flex;
		flex-direction: column; /* İçeriği dikey yönde hizalar */
		justify-content: space-between; /* İçeriği yukarı ve aşağıya düzgün dağıtır */
	    }

		.feature_item img {
			width: 200px; /* Resmi sabit genişlikte tutar */
			height: auto; /* Oranlarını korur */
			margin: 0 auto 20px auto; /* Resmi ortalar ve altına boşluk ekler */
		}

		.feature_item h4 {
			margin: 10px 0; /* Başlığın etrafında boşluk bırakır */
			font-size: 1.5em; /* Başlığın boyutunu ayarlar */
		}

		.feature_item p {
			flex-grow: 1; /* Paragrafın esneyip tüm boş alanı kaplamasını sağlar */
			font-size: 0.9em; /* Metin boyutunu ayarlar */
		}

    </style>
</head>
