<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sertifikalarım</title>
    <link rel="stylesheet" href="css/bootstrap.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="vendors/linericon/style.css">
    <link rel="stylesheet" href="css/font-awesome.min.css">
    <link rel="stylesheet" href="vendors/owl-carousel/owl.carousel.min.css">
    <link rel="stylesheet" href="css/magnific-popup.css">
    <link rel="stylesheet" href="vendors/nice-select/css/nice-select.css">
    
    <style>
        body {
            background-image: url('./img/bgimage3.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: white;
        }
        a, h1, h2, h3, h4, h5, h6, p {
            color: #6A0D91;
        }
        .portfolio_box {
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 376px;
            position: relative;
            overflow: hidden;
            margin-bottom: 30px;
        }
        .single_portfolio {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            width: 100%;
        }
        .single_portfolio img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .short_info h5 {
            margin: 0;
            color: #6A0D91;
        }
        .feature_item {
            width: 100%;
            height: 400px;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .feature_item img {
            width: 200px;
            height: auto;
            margin: 0 auto 20px auto;
        }
        .feature_item h4 {
            margin: 10px 0;
            font-size: 1.5em;
        }
        .feature_item p {
            flex-grow: 1;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <!--================ Start Portfolio Area =================-->
    <section class="portfolio_area" id="portfolio">
        <div class="container">
            <div class="row">
                <div class="col-lg-12">
                    <div class="main_title text-left">
                        <h2>SERTİFİKALARIM</h2>
                    </div>
                </div>
            </div>
            <div class="filters-content">
                <div class="row portfolio-grid justify-content-center">
                    <!-- Sertifika Örneği 1 -->
                    <div class="col-lg-4 col-md-6 all latest">
                        <div class="portfolio_box">
                            <div class="single_portfolio">
                                <img class="img-fluid w-100" src="./img/ilkYardimSertifika.png" alt="">
                                <div class="overlay"></div>
                                <a href="./img/ilkYardimSertifika.png" class="img-gal">
                                    <div class="icon"><span class="lnr lnr-cross"></span></div>
                                </a>
                            </div>
                            <div class="short_info">
                                <h5>ODTU Bilgeiş İlk Yardım</h5>
                            </div>
                        </div>
                    </div>
                    <!-- Sertifika Örneği 2 -->
                    <div class="col-lg-4 col-md-6 all popular">
                        <div class="portfolio_box">
                            <div class="single_portfolio">
                                <img class="img-fluid w-100" src="./img/yapayZeka1Sertifika.png" alt="">
                                <div class="overlay"></div>
                                <a href="./img/yapayZeka1Sertifika.png" class="img-gal">
                                    <div class="icon"><span class="lnr lnr-cross"></span></div>
                                </a>
                            </div>
                            <div class="short_info">
                                <h5>ODTU Bilgeiş Herkes İçin Yapay Zeka-1</h5>
                            </div>
                        </div>
                    </div>
                    <!-- Sertifika Örneği 3 -->
                    <div class="col-lg-4 col-md-6 all latest">
                        <div class="portfolio_box">
                            <div class="single_portfolio">
                                <img class="img-fluid w-100" src="./img/yapayZeka2Sertifika.png" alt="">
                                <div class="overlay"></div>
                                <a href="./img/yapayZeka2Sertifika.png" class="img-gal">
                                    <div class="icon"><span class="lnr lnr-cross"></span></div>
                                </a>
                            </div>
                            <div class="short_info">
                                <h5>ODTU Bilgeiş Herkes İçin Yapay Zeka-2</h5>
                            </div>
                        </div>
                    </div>
                    <!-- Daha fazla sertifikayı buraya ekleyebilirsin -->
                </div>
            </div>
            <!-- Geri dön butonu -->
            <div class="text-center" style="margin-top: 30px;">
                <a class="primary_btn" href="index.html"><span>Ana Sayfaya Dön</span></a>
            </div>
        </div>
    </section>
    <!--================ End Portfolio Area =================-->

    <script src="js/jquery-3.2.1.min.js"></script>
    <script src="js/popper.js"></script>
    <script src="js/bootstrap.min.js"></script>
    <script src="vendors/isotope/isotope-min.js"></script>
    <script src="vendors/owl-carousel/owl.carousel.min.js"></script>
    <script src="js/jquery.ajaxchimp.min.js"></script>
    <script src="js/mail-script.js"></script>
    <script src="js/theme.js"></script>
</body>
</html>
