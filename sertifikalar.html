<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sertifikalarım</title>
    <link rel="stylesheet" href="css/bootstrap.css">
    <link rel="stylesheet" href="css/style.css">

    <style>
        body {
            background-image: url('./img/bgimage3.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: white;
        }
        a, h1, h2, h3, h4, h5, h6, p {
            color: #6A0D91;
        }
        .portfolio_box {
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 376px;
            position: relative;
            overflow: hidden;
            margin-bottom: 30px;
        }
        .single_portfolio {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            width: 100%;
        }
        .single_portfolio img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .short_info h5 {
            margin: 0;
            color: #6A0D91;
        }
        .feature_item {
            width: 100%;
            height: 400px;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .feature_item img {
            width: 200px;
            height: auto;
            margin: 0 auto 20px auto;
        }
        .feature_item h4 {
            margin: 10px 0;
            font-size: 1.5em;
        }
        .feature_item p {
            flex-grow: 1;
            font-size: 0.9em;
        }
    </style>
</head>
<body>

    <div class="container mt-5">
        <h1 class="text-center mb-5">Sertifikalarım</h1>
        <div class="row">
            <!-- Sertifika 1 -->
            <div class="col-md-4">
                <div class="feature_item">
                    <img src="img/sertifika1.jpg" alt="Sertifika 1">
                    <h4>Python ile Veri Analizi</h4>
                    <p>BTK Akademi - 2024</p>
                </div>
            </div>
            <!-- Sertifika 2 -->
            <div class="col-md-4">
                <div class="feature_item">
                    <img src="img/sertifika2.jpg" alt="Sertifika 2">
                    <h4>Makine Öğrenmesine Giriş</h4>
                    <p>Kaggle - 2024</p>
                </div>
            </div>
            <!-- Sertifika 3 -->
            <div class="col-md-4">
                <div class="feature_item">
                    <img src="img/sertifika3.jpg" alt="Sertifika 3">
                    <h4>Yapay Zeka ve Algoritmalar</h4>
                    <p>BTK Akademi - 2024</p>
                </div>
            </div>
        </div>

        <div class="text-center mt-5">
            <a href="index.html" class="btn btn-primary">Ana Sayfaya Dön</a>
        </div>
    </div>

    <script src="js/jquery.min.js"></script>
    <script src="js/bootstrap.min.js"></script>
</body>
</html>
